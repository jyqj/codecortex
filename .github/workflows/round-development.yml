name: Code index round finalization
on:
  push:
    branches: [opt/code-index-benchmark-v2-20260906]
    paths: ['_dev/finalize_docs.py']
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'jyqj/codecortex' && github.ref == 'refs/heads/opt/code-index-benchmark-v2-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Synchronize documentation and remove development machinery
        run: |
          python3 _dev/finalize_docs.py
          git diff --exit-code -- crates
          git diff --check
          test ! -e .github/workflows/round-development.yml
          test -z "$(find _dev -type f -print)"
          git add -A
          git -c user.name='CodeCortex automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: synchronize benchmark contracts and remove temporary development machinery'
          git push origin HEAD:refs/heads/opt/code-index-benchmark-v2-20260906
          echo "Final PR source commit $(git rev-parse HEAD)"
