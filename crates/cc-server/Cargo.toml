[package]
name = "cc-server"
version.workspace = true
edition.workspace = true

[lib]
name = "cc_server"
path = "src/lib.rs"

[[bin]]
name = "codecortex"
path = "src/main.rs"

[dependencies]
cc-model = { path = "../cc-model" }
cc-db = { path = "../cc-db" }
cc-index = { path = "../cc-index" }
cc-search = { path = "../cc-search" }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
dirs.workspace = true
notify.workspace = true
regex.workspace = true
chrono.workspace = true
lru.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
# Tests seed the index DB with raw SQL through their own connections;
# production code reads exclusively through cc-db's typed facets.
rusqlite.workspace = true
tempfile = "3"
