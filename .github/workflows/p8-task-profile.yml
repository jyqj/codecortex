name: P8 complete descriptive task profile measurements
'on':
  workflow_dispatch: null
  pull_request:
    types:
    - labeled
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  RUSTFLAGS: ''
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'p8-task-profile-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/artifacts/
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
    - name: Compile and bind the task executable and exact 45-cell registry
      run: |
        python3 scripts/p8_task_profile_matrix.py build \
          --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/p8-task-build" \
          --target-directory "$RUNNER_TEMP/p8-task-cargo" \
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
    - name: Validate all 45 release-mode plans without executing a measurement
      run: |
        cargo test --release -p cc-eval --test p8_scale --locked \
          --target-dir "$RUNNER_TEMP/p8-task-cargo" \
          task_descriptive_scope_is_explicit_n1_without_weakening_old_n30 -- --exact
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: p8-task-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/p8-task-build
        if-no-files-found: error
      name: Preserve original build, binary, registry and unsuccessful preparation
  measure:
    needs:
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
        - cell: no_op-100000
          profile: no_op
          scale: 100000
          fanout: ''
        - cell: no_op-50000
          profile: no_op
          scale: 50000
          fanout: ''
        - cell: no_op-10000
          profile: no_op
          scale: 10000
          fanout: ''
        - cell: no_op-5000
          profile: no_op
          scale: 5000
          fanout: ''
        - cell: no_op-1000
          profile: no_op
          scale: 1000
          fanout: ''
        - cell: body-100000
          profile: body
          scale: 100000
          fanout: ''
        - cell: body-50000
          profile: body
          scale: 50000
          fanout: ''
        - cell: body-10000
          profile: body
          scale: 10000
          fanout: ''
        - cell: body-5000
          profile: body
          scale: 5000
          fanout: ''
        - cell: body-1000
          profile: body
          scale: 1000
          fanout: ''
        - cell: api-100000
