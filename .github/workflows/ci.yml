name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Eval suite
        run: cargo test -p cc-eval -- integration_fixtures_and_corpus --nocapture

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2

      - name: MSRV check
        run: cargo check --workspace --all-targets --locked

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache pinned audit CLI
        id: audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2-v1
      - name: Install pinned audit CLI
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit vulnerabilities and all informational warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --version
          status=0
          cargo audit --deny warnings --json > audit.json || status=$?
          cat audit.json
          exit "$status"
      - name: Retain machine-readable security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit.json
          retention-days: 90
          if-no-files-found: warn
