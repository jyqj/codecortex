name: Publish verified audit source
on:
  push:
    branches: [fix/nonembedding-facts-quality-20260906]
    paths: [.github/workflows/audit-publish.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'jyqj/codecortex' && github.ref == 'refs/heads/fix/nonembedding-facts-quality-20260906'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify every source blob and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, shutil
          from pathlib import Path, PurePosixPath
          encoded = ''.join(Path(f'.audit-transfer/part{i}.b64').read_text().strip() for i in range(6))
          delta_bytes = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(delta_bytes).hexdigest() == 'af1cd23d7a72ef8c0fb60c4eb9ec5e83883c0c908a92f46a34e3086cb191a707', 'delta integrity failure'
          delta = json.loads(delta_bytes)
          assert len(delta) == 68
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          seen = set()
          for entry in delta:
              name = entry['path']
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              assert name not in seen
              seen.add(name)
              path = Path(name)
              assert not path.is_symlink()
              assert all(not parent.is_symlink() for parent in path.parents)
              if entry['old'] is None:
                  assert not path.exists(), f'unexpected existing file: {name}'
                  old = b''
              else:
                  old = path.read_bytes()
                  assert blob(old) == entry['old'], f'baseline blob mismatch: {name}'
              if entry['new'] is None:
                  path.unlink()
                  continue
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode('utf-8')
              assert blob(new) == entry['new'], f'new blob mismatch: {name}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          for name in ('audit-toolchain.yml', 'audit-tokenizer.yml', 'audit-publish.yml'):
              Path('.github/workflows', name).unlink()
          shutil.rmtree('.audit-transfer')
          print(f'All {len(delta)} source changes verified; temporary workflows and transfer removed.')
          PY
          git add -A
          git diff --cached --check
          actual_tree=$(git write-tree)
          echo "Verified source tree: $actual_tree"
          test "$actual_tree" = 6dad3e6b2fedbe1d17a2b8683bcd95b68c8da0f5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make code facts, resolver invalidation and evidence budgets verifiable' -m 'Source tree matches local tested tree 6dad3e6b2fedbe1d17a2b8683bcd95b68c8da0f5. Removes all temporary transport and provisioning workflows. No embedding or new production dependencies.'
          git push origin HEAD:refs/heads/fix/nonembedding-facts-quality-20260906
          mkdir -p "$RUNNER_TEMP/audit-publication"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/audit-publication/provenance.txt"
          git archive HEAD -o "$RUNNER_TEMP/audit-publication/source.tar"
          git show --stat --oneline HEAD > "$RUNNER_TEMP/audit-publication/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-audit-source-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-publication/
          retention-days: 90
