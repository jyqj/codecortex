name = "search_golden_js_middleware"
tool = "search"
description = "Golden: exact symbol lookup for Express middleware authMiddleware"

[params]
query = "authMiddleware"
mode = "symbol"
exact = true
top_k = 5

[[assertions]]
kind = "is_success"

[[assertions]]
kind = "expected_symbols"
value = "authMiddleware"
min_recall = 1.0

[[assertions]]
kind = "output_contains"
value = "middleware.js"
