name: P7 fixed artifact independent audit

on:
  push:
    branches: [work/p7-audit-996727-20261008]

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONOPTIMIZE: "0"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and hash the five exact completed-run archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 artifacts/checkpoints/p7-final-acceptance-20261008/ci-audit/inspect_fixed_artifacts.py \
            --manifest artifacts/checkpoints/p7-final-acceptance-20261008/ci-audit/fixed-artifacts.json \
            --downloads "$RUNNER_TEMP/p7-audit-downloads" \
            --output "$RUNNER_TEMP/p7-audit-preflight"
      - name: Preserve preflight observations without granting acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-ffdc-audit-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/p7-audit-preflight
          if-no-files-found: error
