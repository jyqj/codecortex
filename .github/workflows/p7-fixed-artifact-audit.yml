name: P7 exact finalization output readback

on:
  push:
    branches: [work/p7-audit-996727-20261008]

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONOPTIMIZE: "0"

jobs:
  export-completed-output:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: artifacts/checkpoints/p7-final-acceptance-20261008/ci-audit
      - name: Export a bounded exact part of the successful finalization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 artifacts/checkpoints/p7-final-acceptance-20261008/ci-audit/export_completed_finalization.py \
            --part ${{ matrix.part }} --output "$RUNNER_TEMP/finalization-part-${{ matrix.part }}"
