name: Replay only original raw with independently pinned input bytes
on:
  push:
    branches: [work/p8-temporal-replay-996727-20261008]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.95.0'
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Read independent replay selection without dispatching queries
        run: |
          python3 -I -S - <<'PY'
          import json, os, re
          from pathlib import Path
          p = Path(os.environ["GITHUB_WORKSPACE"]) / "controller/artifacts/benchmarks/prospective-temporal-v2/workflow-control/replay-request.json"
          v = json.loads(p.read_bytes())
          if not (v["schema_version"] == 1 and v["execution_run_attempt"] == "1"
                  and re.fullmatch("[0-9]+", v["execution_run_id"])
                  and re.fullmatch("[0-9a-f]{40}", v["execution_utility_commit"])
                  and v["execution_artifact_name"] == "p8-prospective-temporal-execution"):
              raise ValueError("fixed actual raw replay selection required")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("ORIGINAL_EXECUTION_RUN=" + v["execution_run_id"] + "\n")
              f.write("ORIGINAL_UTILITY_COMMIT=" + v["execution_utility_commit"] + "\n")
          print(json.dumps({"original_run": v["execution_run_id"], "original_utility": v["execution_utility_commit"], "new_product_queries": 0}))
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ORIGINAL_UTILITY_COMMIT }}
          path: utility
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2cd04485b0e0b23483f64671d56538bbaa47f442
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mahmoud/boltons
          ref: 4e5faa3d7e4008d89e0d8bf1ea87b6d9a061a16d
          path: upstream
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: p8-fresh-release-external-revision2
          path: package-input
          repository: jyqj/codecortex
          run-id: '37749276827'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: p8-prospective-temporal-execution
          path: original-input
          repository: jyqj/codecortex
          run-id: ${{ env.ORIGINAL_EXECUTION_RUN }}
          github-token: ${{ github.token }}
      - name: Restore fixed Rust and prepare observable rg runtime
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          test -x /usr/bin/rg
          /usr/bin/rg --version
          python3 -I -S --version
      - name: Verify same actual parent and isolated child Rust binaries
        run: python3 -I -S "$GITHUB_WORKSPACE/utility/artifacts/checkpoints/p8-temporal-preseal-environment-20261008/shared_rust.py"
      - name: Parse frozen entrypoints without writing bytecode
        run: |
          python3 -I -S - <<'PY'
          import ast, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "utility"
          for rel in ("artifacts/benchmarks/prospective-temporal-v2/implementation/temporal.py",
                      "artifacts/benchmarks/prospective-temporal-v2/service-workflow/service_workflow.py"):
              p = root / rel
              ast.parse(p.read_bytes(), filename=str(p))
          print("actual Python syntax parsed; not execution or acceptance")
          PY
      - name: Replay only original raw with independently pinned input bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -S "$GITHUB_WORKSPACE/utility/artifacts/benchmarks/prospective-temporal-v2/service-workflow/service_workflow.py" replay \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/ptv2-raw-replay-service" \
            --request "$GITHUB_WORKSPACE/controller/artifacts/benchmarks/prospective-temporal-v2/workflow-control/replay-request.json" \
            --original "$GITHUB_WORKSPACE/original-input"
      - name: Record bounded actual status without publishing question text
        if: always()
        run: |
          python3 -I -S - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ptv2-raw-replay-service"
          for rel in ("workflow-failure.json", "result.json", "execution/failure.json", "execution/result.json"):
              path = root / rel
              if path.is_file():
                  value = json.loads(path.read_bytes())
                  keys = ("status", "error_type", "actual_helper_process_exit_code", "actual_scheduled_results",
                          "scheduled_product_queries", "new_product_queries", "data_sealed", "task_acceptance")
                  print(rel + " " + json.dumps({key: value[key] for key in keys if key in value}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-prospective-temporal-raw-replay
          path: ${{ runner.temp }}/ptv2-raw-replay-service
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-prospective-temporal-raw-replay-shared-rust
          path: ${{ runner.temp }}/ptv2-shared-rust-environment.json
          if-no-files-found: error
