[package]
name = "cc-eval"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
cc-server = { path = "../cc-server" }
cc-model = { path = "../cc-model" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
regex = { workspace = true }
# The eval backend drives the REAL MCP dispatch path in-process:
# cc-server's mcp.rs is compiled into this crate (see src/lib.rs `mcp_wire`)
# and exercised over an rmcp duplex client↔server JSON-RPC connection.
tokio = { workspace = true }
tracing = { workspace = true }
rmcp = { workspace = true, features = ["client"] }

[dev-dependencies]
tempfile = "3"
