name: P7 closeout evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: -D warnings

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Bind current source and isolated build
        run: |
          mkdir -p "$RUNNER_TEMP/p7-closeout"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/p7-closeout-target" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from p7_build_identity import json_bytes, source_snapshot
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-closeout'
          (out / 'source-before.json').write_bytes(json_bytes(source_snapshot(pathlib.Path.cwd())))
          PY

      - name: Actual cache races, process faults and WAL recovery
        run: |
          set -o pipefail
          cargo test -p cc-db --locked --lib -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/db-rebuild-faults.log"
          cargo test -p cc-db --locked --test semantic_rebuild --test semantic_recovery \
            --test semantic_publish --test semantic_lease --test semantic_queue -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/db-lifecycle.log"
          cargo test -p cc-semantic --locked --all-targets -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/semantic-fault-matrix.log"

      - name: Original default, semantic and HTTP wiring contracts
        run: |
          set -o pipefail
          cargo test -p cc-server --locked --test p7_v18_parameter_contract --test mcp_stdio \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p7-closeout/default-wiring.log"
          cargo test -p cc-server --locked --features semantic --test p7_v18_parameter_contract \
            --test p7_gc_retention_config --test p7_runtime_independent_review -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/semantic-wiring.log"
          cargo test -p cc-server --locked --features semantic-http --lib -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/http-runtime.log"
          cargo test -p cc-server --locked --features semantic-http --test p7_v18_parameter_contract \
            --test p7_v18_fault_contract --test p7_runtime_independent_review \
            --test p7_gc_retention_config --test mcp_stdio -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/http-wiring.log"
          cargo test -p cc-model --locked --lib semantic_ -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/semantic-config.log"

      - name: Original thirteen-checkpoint real stdio lifecycle
        id: http_lifecycle
        if: always()
        run: |
          set -o pipefail
          cargo build -p cc-server --bin codecortex --features semantic-http --locked \
            --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/p7-closeout/http-product-build.jsonl" \
            2> "$RUNNER_TEMP/p7-closeout/http-product-build.stderr.log"
          sha256sum "$CARGO_TARGET_DIR/debug/codecortex" > "$RUNNER_TEMP/p7-closeout/http-product.sha256"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, sys
          sys.path.insert(0, 'scripts')
          from p7_build_identity import source_snapshot
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-closeout'
          before = json.loads((out / 'source-before.json').read_text())
          after = source_snapshot(root)
          assert before == after, 'HTTP product source changed during compilation'
          rows = [json.loads(x) for x in (out / 'http-product-build.jsonl').read_text().splitlines()]
          rows = [x for x in rows if x.get('reason') == 'compiler-artifact'
                  and x.get('target', {}).get('name') == 'codecortex'
                  and x.get('target', {}).get('kind') == ['bin'] and x.get('executable')]
          assert len(rows) == 1 and 'semantic-http' in rows[0]['features'], rows
          artifact = rows[0]
          assert pathlib.Path(artifact['manifest_path']).resolve() == root / 'crates/cc-server/Cargo.toml'
          assert pathlib.Path(artifact['target']['src_path']).resolve() == root / 'crates/cc-server/src/main.rs'
          assert pathlib.Path(artifact['executable']).resolve().is_relative_to(pathlib.Path(os.environ['CARGO_TARGET_DIR']).resolve())
          assert artifact['profile']['opt_level'] == '0' and artifact['profile']['debug_assertions'] is True
          assert artifact['profile']['test'] is False
          binary = out / 'http-codecortex'
          shutil.copy2(rows[0]['executable'], binary)
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          assert digest == hashlib.sha256(pathlib.Path(rows[0]['executable']).read_bytes()).hexdigest()
          driver = root / 'artifacts/checkpoints/p7-gate-lifecycle-independent-20261003/lifecycle_stdio.py'
          driver_sha256 = hashlib.sha256(driver.read_bytes()).hexdigest()
          assert not driver.is_symlink() and driver_sha256 == '39630b6be2bba3319584af74521863ef5d53a4e7fd723de8c3a454b29e34259c', 'original lifecycle driver changed'
          receipt = {'binary_path': str(binary), 'binary_sha256': digest,
                     'lifecycle_driver': str(driver), 'lifecycle_driver_sha256': driver_sha256,
                     'build_exit_code': 0, 'cargo_artifact': rows[0],
                     'source_before': before, 'source_after': after,
                     'cargo_log_sha256': hashlib.sha256((out / 'http-product-build.jsonl').read_bytes()).hexdigest()}
          (out / 'http-build-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          python3 artifacts/checkpoints/p7-gate-lifecycle-independent-20261003/lifecycle_stdio.py \
            "$RUNNER_TEMP/p7-closeout/http-codecortex" "$RUNNER_TEMP/p7-closeout/lifecycle" \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/lifecycle.log"
          python3 - <<'PY_AFTER_LIFECYCLE'
          import hashlib, json, os, pathlib
          receipt = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-closeout/http-build-receipt.json').read_text())
          driver = pathlib.Path(receipt['lifecycle_driver'])
          assert not driver.is_symlink() and hashlib.sha256(driver.read_bytes()).hexdigest() == receipt['lifecycle_driver_sha256']
          PY_AFTER_LIFECYCLE

      - name: Three-seed real product retry, crash, deletion, recovery and automatic GC
        if: always() && steps.http_lifecycle.outcome == 'success'
        run: |
          set -o pipefail
          python3 scripts/p7_fault_lifecycle_stdio.py \
            --binary "$RUNNER_TEMP/p7-closeout/http-codecortex" \
            --build-receipt "$RUNNER_TEMP/p7-closeout/http-build-receipt.json" \
            --output "$RUNNER_TEMP/p7-closeout/fault-lifecycle" \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/fault-lifecycle.log"

      - name: Attributed resources and actual worker contention
        if: always()
        env:
          CODECORTEX_WORKER_CONTENTION_EVIDENCE_DIR: ${{ runner.temp }}/p7-closeout/worker-contention
        run: |
          set -o pipefail
          cargo test -p cc-eval --locked --lib \
            self_usage_has_direct_identity_and_monotonic_cpu_without_procfs_lookup -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-closeout/self-resources.log"
          cargo test -p cc-eval --features semantic --locked \
            --test p7_worker_contention --test semantic_lifecycle --test p7_strategy_ablation \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p7-closeout/worker-strategy.log"

      - name: Preserve final source identity
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from p7_build_identity import json_bytes, source_snapshot
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-closeout'
          after = source_snapshot(pathlib.Path.cwd())
          (out / 'source-after.json').write_bytes(json_bytes(after))
          assert json.loads((out / 'source-before.json').read_text()) == after
          PY

      - name: Archive exact commands and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-closeout-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p7-closeout
          include-hidden-files: true
          if-no-files-found: error

  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build four independent complete source snapshots
        env:
          EXACT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/p7_mechanism_build.py --source "$PWD" --expected-head "$EXACT_SOURCE" \
            --output "$RUNNER_TEMP/p7-019-build" --jobs 2 --discard-targets
      - name: Actual local, dense-only, hybrid and no-lanes control with paired replay
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/p7-019-runner-target
          P7_MECHANISM_BUILD_MANIFEST: ${{ runner.temp }}/p7-019-build/mechanism-build.json
          P7_MECHANISM_EVIDENCE_DIR: ${{ runner.temp }}/p7-019-evidence
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/p7-019-runner"
          cargo test -p cc-eval --features semantic --locked --lib benchmark::ablation::mechanism:: \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p7-019-runner/unit.log"
          cargo test -p cc-eval --features semantic --locked --test p7_strategy_ablation \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p7-019-runner/old-ablation.log"
          cargo test -p cc-eval --features semantic --locked --test p7_mechanism_stdio \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/p7-019-runner/actual-mechanism.log"
      - name: Archive all arms, build receipts, raw observations and paired statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-mechanism-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/p7-019-build
            ${{ runner.temp }}/p7-019-evidence
            ${{ runner.temp }}/p7-019-runner
          include-hidden-files: true
          if-no-files-found: error

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [default, semantic]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Check process identity and real network negative controls
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/p7-offline"
          python3 -m unittest discover -s scripts/tests -p test_p7_offline_network.py -v \
            2>&1 | tee "$RUNNER_TEMP/p7-offline/network-controls.log"
          rustc --edition 2021 --test crates/cc-eval/tests/support/p7_procfs.rs \
            -o "$RUNNER_TEMP/p7-offline/procfs-controls"
          "$RUNNER_TEMP/p7-offline/procfs-controls" --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-offline/procfs-controls.log"
      - name: Install process-tree syscall observer and verify negative controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y strace
          python3 scripts/p7_offline_trace.py controls --output "$RUNNER_TEMP/p7-offline/trace-controls"
      - name: Build exact package with original private target receipt
        run: |
          python3 scripts/p7_stdio_build_receipt.py --package-kind '${{ matrix.package }}' \
            --output-dir "$RUNNER_TEMP/p7-offline/product" \
            > "$RUNNER_TEMP/p7-offline/product-build-summary.json"
      - name: Build committed adapter test runner
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/p7-offline-runner-target
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from p7_build_identity import json_bytes, source_snapshot
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-offline'
          (out / 'runner-source-before.json').write_bytes(json_bytes(source_snapshot(pathlib.Path.cwd())))
          PY
          cargo test -p cc-eval --test benchmark_adapters --locked --no-run \
            --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/p7-offline/runner-build.jsonl" \
            2> "$RUNNER_TEMP/p7-offline/runner-build.stderr.log"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from p7_build_identity import json_bytes, source_snapshot
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-offline'
          before = json.loads((out / 'runner-source-before.json').read_text())
          after = source_snapshot(pathlib.Path.cwd())
          assert before == after, 'runner source changed during compilation'
          (out / 'runner-source-inputs.json').write_bytes(json_bytes(before['inputs']))
          rows = [json.loads(line) for line in (out / 'runner-build.jsonl').read_text().splitlines()]
          artifacts = [x for x in rows if x.get('reason') == 'compiler-artifact'
                       and x.get('target', {}).get('name') == 'benchmark_adapters'
                       and x.get('executable')]
          assert len(artifacts) == 1, artifacts
          binary = pathlib.Path(artifacts[0]['executable'])
          receipt = {'cargo_artifact': artifacts[0],
                     'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'source_before': {k:v for k,v in before.items() if k != 'inputs'},
                     'source_after': {k:v for k,v in after.items() if k != 'inputs'}}
          (out / 'runner-identity.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('P7_OFFLINE_RUNNER=' + str(binary) + '\n')
          PY
      - name: Original fourteen tools, initial run and reopen, under fatal network guard
        env:
          CODECORTEX_BENCH_BINARY: ${{ runner.temp }}/p7-offline/product/codecortex
          P7_017_PACKAGE_KIND: ${{ matrix.package }}
          P7_017_BUILD_RECEIPT: ${{ runner.temp }}/p7-offline/product/build-receipt.json
          CODECORTEX_BENCH_OBSERVATIONS: ${{ runner.temp }}/p7-offline/observations.jsonl
        run: |
          set -o pipefail
          python3 scripts/p7_offline_trace.py run --package-kind '${{ matrix.package }}' \
            --product "$RUNNER_TEMP/p7-offline/product/codecortex" \
            --build-receipt "$RUNNER_TEMP/p7-offline/product/build-receipt.json" \
            --runner "$P7_OFFLINE_RUNNER" --runner-receipt "$RUNNER_TEMP/p7-offline/runner-identity.json" \
            --output "$RUNNER_TEMP/p7-offline/trace-matrix" \
            2>&1 | tee "$RUNNER_TEMP/p7-offline/product-matrix.log"
      - name: Build candidate scorer from the same fixed default source
        if: matrix.package == 'default'
        run: |
          python3 -B scripts/p8_candidate_execution.py build-runner \
            --output "$RUNNER_TEMP/p7-offline/p8-runner-build" \
            --target-dir "$RUNNER_TEMP/p7-offline/product/cargo-target"
      - name: Freeze candidate, execute original MCP fixture and replay original scorer
        if: matrix.package == 'default'
        env:
          EXACT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B scripts/p8_candidate_execution.py run \
            --product "$RUNNER_TEMP/p7-offline/product/codecortex" \
            --product-build-receipt "$RUNNER_TEMP/p7-offline/product/build-receipt.json" \
            --runner "$RUNNER_TEMP/p7-offline/p8-runner-build/cc-eval" \
            --runner-build-receipt "$RUNNER_TEMP/p7-offline/p8-runner-build/build-receipt.json" \
            --expected-source-commit "$EXACT_SOURCE" \
            --output "$RUNNER_TEMP/p7-offline/p8-candidate-execution"
      - name: Print bounded offline failure diagnostics
        if: failure()
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'p7-offline'
          budget = 65536
          def emit(record):
              global budget
              line = json.dumps(record, ensure_ascii=True)
              size = len(line.encode()) + 1
              if size > budget:
                  return False
              print(line)
              budget -= size
              return True
          emit({'diagnostic_only': True, 'network_socket_attempts': None,
                'scope': 'bounded failure readback; full verifier and raw artifacts remain authoritative'})
          network = re.compile(r'^(?:<\.\.\. )?(?:socket(?:pair|call)?|connect|bind|listen|accept4?|send(?:to|msg|mmsg)?|recv(?:from|msg|mmsg|mmsg_time64)?|getsockname|getpeername|setsockopt|getsockopt|shutdown|io_uring_(?:setup|enter|register))\b')
          quoted = re.compile(r'"(?:[^"\\]|\\.)*"')
          seen = 0
          for directory, dirs, names in os.walk(root, followlinks=False):
              dirs[:] = sorted(name for name in dirs if name not in {
                  'cargo-target', 'candidate', 'archives', 'prepared-corpus', 'prepared-inputs', 'builds'
              } and not (Path(directory) / name).is_symlink())
              for name in sorted(names):
                  path = Path(directory) / name
                  if path.is_symlink() or not path.is_file():
                      continue
                  relative = str(path.relative_to(root))
                  if seen >= 512 or budget < 512:
                      print(json.dumps({'diagnostic_truncated': True, 'files_inspected': seen}))
                      raise SystemExit(0)
                  if not (name.endswith('.json') or name == 'stderr.log' or re.fullmatch(r'syscalls\.\d+', name)):
                      continue
                  seen += 1
                  try:
                      if name.endswith('.json') and path.stat().st_size <= 262144:
                          value = json.loads(path.read_text())
                          if isinstance(value, dict) and value.get('action') in ('errno', 'kill') and 'before' in value:
                              keys = ('action', 'result', 'before', 'after', 'socket_fds_before_exec',
                                      'closed_socket_fds', 'ipv4', 'ipv6', 'local_ipc_policy', 'exec_sha256', 'error')
                              emit({'file': relative, 'guard': {key: value[key] for key in keys if key in value}})
                          elif name == 'failure.json' and isinstance(value, dict):
                              emit({'file': relative, 'failure': {key: value.get(key) for key in
                                    ('status', 'error', 'network_socket_attempts')}})
                      elif name == 'stderr.log':
                          with path.open('rb') as stream:
                              stream.seek(max(0, path.stat().st_size - 8192))
                              tail = stream.read(8192).decode('utf-8', 'replace')
                          if tail:
                              emit({'file': relative, 'stderr_tail': tail, 'tail_only': True})
                      elif re.fullmatch(r'syscalls\.\d+', name):
                          with path.open('rb') as stream:
                              data = stream.read(2 * 1024 * 1024 + 1)
                          for line in data[:2 * 1024 * 1024].decode('utf-8', 'replace').splitlines():
                              event = re.sub(r'^\d+\.\d{6} ', '', line)
                              if network.match(event) or event.startswith('+++ ') or 'SIGSYS' in event:
                                  emit({'file': relative, 'trace_diagnostic': quoted.sub('"<quoted>"', line)[:4096]})
                          if len(data) > 2 * 1024 * 1024:
                              emit({'file': relative, 'diagnostic_prefix_truncated': True})
                  except (OSError, ValueError) as error:
                      emit({'file': relative, 'diagnostic_read_error': str(error)[:512]})
          PY
      - name: Archive package, commands, identities and raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-offline-${{ matrix.package }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/p7-offline
            !${{ runner.temp }}/p7-offline/product/cargo-target
          include-hidden-files: true
          if-no-files-found: error
