name: P8 external fixed-input recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  external-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONOPTIMIZE: "0"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check new entry syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p = Path("artifacts/benchmarks/p8-external-recovery-20261008/recover_external.py")
          ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
          PY
      - name: Download the original accepted default artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/jyqj/codecortex/actions/artifacts/11529447454/zip > "$RUNNER_TEMP/p8-default-ffdc.zip"
      - name: Recover inputs and execute original compat and native runner
        run: |
          python3 artifacts/benchmarks/p8-external-recovery-20261008/recover_external.py \
            --manifest artifacts/benchmarks/p8-external-recovery-20261008/manifest.json \
            --archive "$RUNNER_TEMP/p8-default-ffdc.zip" \
            --work "$RUNNER_TEMP/p8-external-private" \
            --public-output "$RUNNER_TEMP/p8-external-public"
      - name: Preserve actual public evidence and external-body references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-external-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/p8-external-public
          if-no-files-found: warn
          retention-days: 30
