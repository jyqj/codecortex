      run: |
        python3 scripts/p8_task_profile_capture.py checkpoint \
          --directory "$RUNNER_TEMP/p8-task-cell-$P8_TASK_CELL" --index 1
      env:
        PREVIOUS_ARTIFACT_ID: ${{ steps.upload_00.outputs.artifact-id }}
        PREVIOUS_ARTIFACT_DIGEST: ${{ steps.upload_00.outputs.artifact-digest }}
    - uses: actions/upload-artifact@v4
