name: P8 snapshot leaf batch engineering

on:
  push:
    branches: [task/p8-snapshot-leaf-engineering-fix-20261009]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  RUSTFLAGS: ""
  RUSTC_WRAPPER: ""
  RUSTC_WORKSPACE_WRAPPER: ""

jobs:
  controls_and_build:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - name: Fetch locked dependencies before engineering controls
        run: cargo fetch --locked
      - name: Capture fixed-source controls and preserve every attempted command
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          if sys.flags.optimize:
              raise SystemExit('optimized Python cannot run evidence controls')
          sys.path.insert(0, 'scripts')
          from p7_build_identity import json_bytes, source_snapshot

          """Strict libtest population validation; never substitutes for test execution."""
          import re


          def validate_test_stdout(text, expected):
              if not expected or len(expected) != len(set(expected)):
                  raise ValueError("expected test population must be nonempty and unique")
              running = re.findall(r"^running (\d+) tests?\s*$", text, re.M)
              if running != [str(len(expected))]:
                  raise ValueError("missing, repeated, or wrong running test count")
              lines = [line for line in text.splitlines()
                       if line.startswith("test ") and not line.startswith("test result:")]
              rows = []
              for line in lines:
                  match = re.fullmatch(r"test (.+) \.\.\. (\S+)", line)
                  if not match or match.group(2) != "ok":
                      raise ValueError("malformed, failed, or ignored test line")
                  rows.append(match.group(1))
              if sorted(rows) != sorted(expected):
                  raise ValueError("actual test names differ from the exact registered population")
              summaries = [line for line in text.splitlines() if line.startswith("test result:")]
              if len(summaries) != 1:
                  raise ValueError("missing or repeated libtest summary")
              match = re.fullmatch(
                  r"test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; "
                  r"\d+ filtered out; finished in [0-9.]+s", summaries[0])
              if not match or int(match.group(1)) != len(expected):
                  raise ValueError("failed, ignored, measured, or inconsistent libtest summary")
              return {"expected_count": len(expected), "actual_names": sorted(rows),
                      "passed": len(rows), "failed": 0, "ignored": 0, "measured": 0}

          commands = [['cargo', 'fmt', '--all', '--', '--check'], ['cargo', 'clippy', '--locked', '--offline', '-p', 'cc-index', '-p', 'cc-db', '-p', 'cc-eval', '--all-targets', '--', '-D', 'warnings'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--test', 'p2b_resolution_store'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-index', '--test', 'qname_identity_transaction'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-index', '--test', 'qname_identity_proof'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--test', 'public_surface_store'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--lib', 'full_rebuild_advances_both_epochs_past_previous_values'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--lib', 'rebuild_generation_exceeds_writes_committed_during_rebuild'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--lib', 'staging_checkpoint_busy_preserves_wal_and_refuses_replacement'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--lib', 'schema_mismatch_rebuild_advances_generation_past_old_values'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--test', 'p2d_dependency_cost'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-eval', '--test', 'p8_scale'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-eval', '--test', 'benchmark_oracle_streaming'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--lib', 'index_db_snapshot_insert::tests'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-index', '--test', 'snapshot_leaf_batching'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--lib', 'index_db::tests::precompressed_chunk_payloads_match_in_transaction_compression', '--', '--exact'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--lib', 'index_db::tests::direct_rebuild_canonical_schema_matches_normal_temp_path', '--', '--exact'], ['cargo', 'test', '--locked', '--offline', '-p', 'cc-db', '--lib', 'index_db::tests::direct_rebuild_callback_and_index_errors_leave_live_database_unchanged', '--', '--exact']]
          expected_tests = {2: ['bounded_frontier_excludes_changed_files_before_counting_and_crosses_batches', 'corrupt_payload_is_rejected', 'dependency_manifest_roundtrip_reverse_lookup_delete_and_rollback', 'package_aggregate_tracks_files_and_test_visibility'], 3: ['only_the_real_sql_surviving_declaration_gets_identity_without_candidate_deduplication', 'real_file_transaction_rejects_changed_relation_and_preserves_previous_generation'], 4: ['association_requires_unique_exact_complete_source_and_matching_existing_labels', 'decorated_body_call_owners_use_the_same_canonical_parser_identity', 'parser_lexical_qnames_distinguish_function_locals_class_methods_and_async_decorated_scopes', 'same_name_neighbor_owner_cannot_authorize_a_disjoint_body_chunk'], 5: ['a_bad_surface_rolls_back_the_whole_file_batch', 'batched_surface_reads_cross_placeholder_boundary_without_losing_empty_unknown', 'corrupt_fingerprint_and_new_format_fail_closed', 'nonempty_surface_roundtrip_canonicalizes_declaration_order', 'previous_schema_cannot_reuse_absent_surface_evidence', 'surface_roundtrip_shares_file_epoch_and_cascades_on_delete'], 6: ['index_db::tests::full_rebuild_advances_both_epochs_past_previous_values'], 7: ['index_db::tests::rebuild_generation_exceeds_writes_committed_during_rebuild'], 8: ['index_db::tests::staging_checkpoint_busy_preserves_wal_and_refuses_replacement'], 9: ['index_db::tests::schema_mismatch_rebuild_advances_generation_past_old_values'], 10: ['p2d_dependency_queries_bound_rows_across_unrelated_scale_and_completed_prefixes'], 11: ['actual_shard_keeps_global_ids_and_changes_exact_batch_including_yaml_and_routes', 'bounded_python_forwarding_resume_keeps_all_targets_and_fifteen_table_parity', 'complete_stage_timing_accounts_for_real_split_handoffs_and_full_staging', 'configured_evidence_budget_stops_without_overwriting_partial_raw', 'failed_independent_fanout_truth_remains_a_failure', 'matrix_and_release_admission_are_explicit_and_bounded', 'named_scale_capacity_is_explicit_and_cannot_relax_fanout_pressure', 'native_evidence_hash_uses_all_file_bytes_without_running_a_profile', 'real_scale_smoke_preserves_builds_counts_mutations_and_full_parity', 'shards_partition_registered_repetitions_without_lowering_release_admission', 'subprocess_deadline_preserves_report_and_rejects_output_reuse', 'subprocess_descendant_cannot_hold_stderr_past_worker_deadline'], 12: ['agrees_with_legacy_for_all_types_duplicates_and_physical_columns', 'cached_canonical_order_matches_original_serialized_key_bytes', 'compares_more_than_the_legacy_row_budget_and_detects_the_last_row_change', 'detects_content_multiplicity_and_missing_rows_without_hash_only_equality', 'every_existing_table_remains_part_of_the_comparison', 'malformed_schema_utf8_and_foreign_keys_cannot_be_equal', 'preserves_legacy_signed_zero_equality_without_rewriting_order_or_digests', 'row_byte_and_disk_budgets_fail_instead_of_certifying_a_prefix'], 13: ['index_db_snapshot_insert::tests::bound_payload_measures_sql_values_and_keeps_large_rows_legal', 'index_db_snapshot_insert::tests::failed_window_stops_before_later_rows_or_tables', 'index_db_snapshot_insert::tests::semantic_leaf_batches_reduce_actual_sqlite_statement_runs'], 14: ['snapshot_leaf_byte_windows_and_oversize_single_rows_preserve_values', 'snapshot_leaf_direct_writer_preserves_original_adapter_pragmas_and_bytes', 'snapshot_leaf_duplicate_paths_future_fk_and_late_identity_error_roll_back_wal', 'snapshot_leaf_never_delays_identity_checks_past_the_next_file', 'snapshot_leaf_symbol_id_and_uid_conflicts_keep_sql_survivors_and_fts', 'snapshot_leaf_tier_boundaries_preserve_all_fifteen_tables_and_fts'], 15: ['index_db::tests::precompressed_chunk_payloads_match_in_transaction_compression'], 16: ['index_db::tests::direct_rebuild_canonical_schema_matches_normal_temp_path'], 17: ['index_db::tests::direct_rebuild_callback_and_index_errors_leave_live_database_unchanged']}
          expected_observers = {'scripts/p7_build_identity.py': '5003305105464936edf8f444fc0b93cd14a5d5f074dc650f16de2259e86f1cc5', 'scripts/p8_scale_matrix.py': 'f169b0f26cf2a87d3e2548d734431c530cbf63d353ac054045ec8be80889f957', 'scripts/p8_runner_capacity.py': '2e37954df30b153ad82b49a5841a977451288c1730d03bfd2d0d7a2ace412939'}
          expected_product_manifest = '691ae804ec606969e70180298407fcacc60b0408ea025eece02c7639b50b94ac'

          out = Path(os.environ['RUNNER_TEMP']) / 'snapshot-leaf-controls'
          out.mkdir(exist_ok=False)
          observations = out / 'observations'
          observations.mkdir()
          env = dict(os.environ)
          env['CARGO_TARGET_DIR'] = str(Path(os.environ['RUNNER_TEMP']) / 'snapshot-leaf-controls-cargo')
          env['CODECORTEX_BENCH_OBSERVATIONS'] = str(observations)
          record = {
              'schema_version': 2,
              'scope': 'Partial engineering controls only; no N30 matrix, TODO or release approval',
              'expected_source': os.environ['GITHUB_SHA'],
              'expected_product_input_count': 1089,
              'expected_product_manifest_sha256': expected_product_manifest,
              'expected_tests': expected_tests,
              'expected_test_count': 53,
              'cwd': str(Path.cwd()),
              'commands': commands,
              'results': [],
              'environment': {key: env.get(key) for key in (
                  'CARGO_TARGET_DIR', 'CARGO_INCREMENTAL', 'CARGO_BUILD_JOBS',
                  'CARGO_PROFILE_DEV_DEBUG', 'CARGO_PROFILE_TEST_DEBUG', 'RUSTFLAGS',
                  'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'CODECORTEX_BENCH_OBSERVATIONS')},
              'status': 'running',
          }
          (out / 'plan.json').write_bytes(json_bytes(record))
          code = 2
          before = None
          observer_before = None
          try:
              before = source_snapshot(Path.cwd())
              (out / 'source-before.json').write_bytes(json_bytes(before))
              if before['source_commit'] != os.environ['GITHUB_SHA']:
                  raise ValueError('checkout does not equal immutable workflow source')
              if before['input_count'] != 1089 or before['manifest_sha256'] != expected_product_manifest:
                  raise ValueError('product inventory differs from the reviewed exact 1089 inputs')
              observer_before = {}
              for name, expected_hash in expected_observers.items():
                  value = Path(name).read_bytes()
                  original = subprocess.check_output(['git', 'show', os.environ['GITHUB_SHA'] + ':' + name])
                  if value != original or hashlib.sha256(value).hexdigest() != expected_hash:
                      raise ValueError('observer differs from fixed reviewed bytes: ' + name)
                  observer_before[name] = {'bytes': len(value), 'sha256': expected_hash}
              (out / 'observer-before.json').write_bytes(json_bytes(observer_before))
              for index, command in enumerate(commands):
                  stem = f'{index:02}'
                  result = {
                      'argv': command,
                      'started_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'stdout': stem + '.stdout',
                      'stderr': stem + '.stderr',
                  }
                  start = time.monotonic_ns()
                  with (out / result['stdout']).open('xb') as stdout, (out / result['stderr']).open('xb') as stderr:
                      process = subprocess.run(command, cwd=Path.cwd(), env=env, stdout=stdout, stderr=stderr, check=False)
                  result.update(exit_code=process.returncode, elapsed_ns=time.monotonic_ns() - start)
                  result['accepted'] = process.returncode == 0
                  if index in expected_tests:
                      try:
                          result['test_population'] = validate_test_stdout((out / result['stdout']).read_text(), expected_tests[index])
                      except Exception as error:
                          result['accepted'] = False
                          result['test_population_error'] = f'{type(error).__name__}: {error}'
                  record['results'].append(result)
                  (out / 'progress.json').write_bytes(json_bytes(record))
                  if not result['accepted']:
                      break
              code = 0 if len(record['results']) == len(commands) and all(row['accepted'] for row in record['results']) else 1
              record['status'] = 'controls_completed' if code == 0 else 'command_or_population_failed'
          except Exception as error:
              record['status'] = 'invalid_engineering_execution'
              record['error'] = f'{type(error).__name__}: {error}'
          finally:
              try:
                  after = source_snapshot(Path.cwd())
                  (out / 'source-after.json').write_bytes(json_bytes(after))
                  record['source_unchanged'] = before is not None and before == after
                  observer_after = {name: {'bytes': Path(name).stat().st_size, 'sha256': hashlib.sha256(Path(name).read_bytes()).hexdigest()}
                                    for name in expected_observers}
                  (out / 'observer-after.json').write_bytes(json_bytes(observer_after))
                  record['observers_unchanged'] = observer_before is not None and observer_before == observer_after
                  if not record['source_unchanged'] or not record['observers_unchanged']:
                      raise ValueError('source or observer changed during attempted controls')
              except Exception as error:
                  code = 2
                  record['status'] = 'invalid_engineering_execution'
                  record['source_after_error'] = f'{type(error).__name__}: {error}'
              record['not_run_command_indices'] = list(range(len(record['results']), len(commands)))
              record['exit_code'] = code
              record['files'] = {
                  path.relative_to(out).as_posix(): {
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in sorted(out.rglob('*')) if path.is_file() and path.name != 'receipt.json'
              }
              (out / 'receipt.json').write_bytes(json_bytes(record))
          print(json.dumps({'status': record['status'], 'exit_code': code, 'attempted_commands': len(record['results'])}))
          raise SystemExit(code)

          PY
      - name: Preserve original control source, logs and SQL counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-snapshot-leaf-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-leaf-controls
          if-no-files-found: error
      - name: Build one exact release scale executable after successful controls
        run: |
          python3 scripts/p8_scale_matrix.py build --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/snapshot-leaf-scale-build" \
            --target-directory "$RUNNER_TEMP/snapshot-leaf-scale-cargo"
      - name: Preserve original release build and exact executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-snapshot-leaf-scale-build-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-leaf-scale-build
          if-no-files-found: error

  diagnostic_small:
    name: engineering scale ${{ matrix.scale }} repetition 0 only
    needs: controls_and_build
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scale: [1000, 10000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          name: p8-snapshot-leaf-scale-build-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-leaf-scale-build
      - name: Enforce original hosted capacity before the partial diagnostic
        env:
          SCALE: ${{ matrix.scale }}
          P8_EXPECTED_SOURCE: ${{ github.sha }}
          P8_CAPACITY_PREPARE_ALLOWED: ${{ github.repository == 'jyqj/codecortex' && runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          python3 scripts/p8_runner_capacity.py --scale "$SCALE" \
            --output "$RUNNER_TEMP/snapshot-leaf-capacity-$SCALE" --prepare-ephemeral
      - name: Preserve capacity observations including refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-snapshot-leaf-capacity-${{ matrix.scale }}-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-leaf-capacity-${{ matrix.scale }}
          if-no-files-found: error
      - name: Execute the original single repetition with every phase and parity check
        env:
          SCALE: ${{ matrix.scale }}
        run: |
          chmod +x "$RUNNER_TEMP/snapshot-leaf-scale-build/p8-scale"
          python3 scripts/p8_scale_matrix.py run --root "$GITHUB_WORKSPACE" \
            --build "$RUNNER_TEMP/snapshot-leaf-scale-build" --scale "$SCALE" \
            --shard-index 0 --shard-count 30 --repetitions 30 --seed 12648430 \
            --deadline-ms 18000000 --capacity-profile scale_capacity_v1 \
            --output "$RUNNER_TEMP/snapshot-leaf-scale-shard-$SCALE-0"
      - name: Preserve partial engineering raw without granting a full matrix pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-snapshot-leaf-shard-${{ matrix.scale }}-0-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-leaf-scale-shard-${{ matrix.scale }}-0
          if-no-files-found: error


  diagnostic_100k:
    name: engineering scale 100000 repetition 0 only
    needs: [controls_and_build, diagnostic_small]
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          name: p8-snapshot-leaf-scale-build-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-leaf-scale-build
      - name: Enforce original hosted capacity before the partial diagnostic
        env:
          SCALE: '100000'
          P8_EXPECTED_SOURCE: ${{ github.sha }}
          P8_CAPACITY_PREPARE_ALLOWED: ${{ github.repository == 'jyqj/codecortex' && runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          python3 scripts/p8_runner_capacity.py --scale "$SCALE" \
            --output "$RUNNER_TEMP/snapshot-leaf-capacity-$SCALE" --prepare-ephemeral
      - name: Preserve capacity observations including refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-snapshot-leaf-capacity-100000-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-leaf-capacity-100000
          if-no-files-found: error
      - name: Execute the original single repetition with every phase and parity check
        env:
          SCALE: '100000'
        run: |
          chmod +x "$RUNNER_TEMP/snapshot-leaf-scale-build/p8-scale"
          python3 scripts/p8_scale_matrix.py run --root "$GITHUB_WORKSPACE" \
            --build "$RUNNER_TEMP/snapshot-leaf-scale-build" --scale "$SCALE" \
