name: P8 original failure gates

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'scripts/p8_gate_controls.py'
      - 'scripts/p8_recovery.py'
      - 'scripts/p8_cold_build.py'
      - 'scripts/p8_rollback.py'
      - 'scripts/p7_build_identity.py'
      - '.github/workflows/p8-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate_controls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Fetch locked dependencies before execution
        run: cargo fetch --locked
      - name: Original quality, latency, lock, policy and inconclusive controls
        run: |
          python3 scripts/p8_gate_controls.py \
            --output "$RUNNER_TEMP/p8-gates" --target "$RUNNER_TEMP/p8-gates-target"
      - name: Preserve every raw fixture, including deliberately invalid ones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-gates-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p8-gates
          if-no-files-found: error
