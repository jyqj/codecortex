[package]
name = "capability-snapshot-ab"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
cc-db = { path = "../../../../crates/cc-db" }
cc-model = { path = "../../../../crates/cc-model" }
cc-server = { path = "../../../../crates/cc-server", features = ["semantic-http"] }
cc-semantic = { path = "../../../../crates/cc-semantic" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
[features]
default = ["semantic", "semantic-http"]
semantic = []
semantic-http = ["semantic"]
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
