          fanout: ''
        - cell: batch_1000-5000
          profile: batch_1000
          scale: 5000
          fanout: ''
        - cell: batch_1000-1000
          profile: batch_1000
          scale: 1000
          fanout: ''
        - cell: fanout-1
          profile: fanout
          scale: 1000
          fanout: 1
        - cell: fanout-4
          profile: fanout
          scale: 1000
          fanout: 4
        - cell: fanout-16
          profile: fanout
          scale: 1000
          fanout: 16
        - cell: fanout-64
          profile: fanout
          scale: 1000
          fanout: 64
        - cell: fanout-128
          profile: fanout
          scale: 1000
          fanout: 128
    env:
      P8_TASK_CELL: ${{ matrix.cell }}
      P8_TASK_PROFILE: ${{ matrix.profile }}
      P8_TASK_SCALE: ${{ matrix.scale }}
      P8_TASK_FANOUT: ${{ matrix.fanout }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/artifacts/
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
    - uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/p8-task-build
        name: p8-task-build-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Prepare original registered capacity on the disposable hosted VM
      env:
        P8_EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        P8_CAPACITY_PREPARE_ALLOWED: ${{ github.repository == 'jyqj/codecortex' && runner.environment == 'github-hosted' &&
          runner.os == 'Linux' }}
      run: |
        python3 scripts/p8_runner_capacity.py --scale "$P8_TASK_SCALE" \
          --output "$RUNNER_TEMP/p8-task-capacity-$P8_TASK_CELL" --prepare-ephemeral
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: p8-task-capacity-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/p8-task-capacity-${{ matrix.cell }}
        if-no-files-found: error
      name: Preserve original capacity observations
    - name: Launch one exact fresh task cell with setup and parity inside its native deadline
      id: launch
      env:
        P8_EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        chmod +x "$RUNNER_TEMP/p8-task-build/native-build/p8-scale"
        extra=()
        if [[ "$P8_TASK_PROFILE" == "fanout" ]]; then
          extra=(--fanout "$P8_TASK_FANOUT")
        fi
        python3 scripts/p8_task_profile_capture.py launch \
          --root "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/p8-task-build" \
          --directory "$RUNNER_TEMP/p8-task-cell-$P8_TASK_CELL" \
          --expected-source "$P8_EXPECTED_SOURCE" \
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
          --mutation-profile "$P8_TASK_PROFILE" --scale "$P8_TASK_SCALE" "${extra[@]}"
    - name: Freeze original byte prefix at absolute interval 1 of 20
      id: freeze_00
      if: always() && steps.launch.outcome == 'success'
      run: |
        python3 scripts/p8_task_profile_capture.py checkpoint \
          --directory "$RUNNER_TEMP/p8-task-cell-$P8_TASK_CELL" --index 0
    - uses: actions/upload-artifact@v4
      if: always() && steps.freeze_00.outputs.ready == 'true'
      with:
        name: p8-task-progress-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}-00
        path: ${{ steps.freeze_00.outputs.bundle }}
        if-no-files-found: error
      id: upload_00
