name: P8 fixed release candidate and external revision 2
on:
  push:
    branches: [work/p8-release-external-996727-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-external:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '2'
      P8_PRODUCT_SOURCE: '2cd04485b0e0b23483f64671d56538bbaa47f442'
    steps:
      - uses: actions/checkout@v4
        with:
          path: utility
          persist-credentials: false
      - name: Initialize runner paths
        run: echo "P8_RELEASE_OUT=$RUNNER_TEMP/p8-release-external" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: '2cd04485b0e0b23483f64671d56538bbaa47f442'
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Execute fixed-source tests builds and original external contracts
        run: |
          python3 "$GITHUB_WORKSPACE/utility/artifacts/benchmarks/p8-external-recovery-20261008/revision-2/run_release_external.py" \
            --source-root "$GITHUB_WORKSPACE/candidate" --expected-source "$P8_PRODUCT_SOURCE" \
            --output-root "$P8_RELEASE_OUT"
      - name: Print bounded actual outcome without private query bodies
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["P8_RELEASE_OUT"]) / "public"
          for relative in ("driver-result.json", "external/result.json", "candidate-package/package-receipt.json"):
              path = root / relative
              if path.is_file():
                  value = json.loads(path.read_bytes())
                  selected = {k: value[k] for k in (
                      "status", "phase", "exit_code", "ranking", "run_exit_codes", "actual_external_result",
                      "exception", "reason", "source", "manifest", "archive", "release_certified")
                      if k in value}
                  print(relative + ": " + json.dumps(selected, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-fresh-release-external-revision2
          path: ${{ runner.temp }}/p8-release-external/public
          include-hidden-files: true
          if-no-files-found: error
