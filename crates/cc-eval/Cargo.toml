[package]
name = "cc-eval"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cc-server = { path = "../cc-server" }
cc-model = { path = "../cc-model" }
# RSS sampling (bench/soak) + the watcher-parity Targeted incremental
# scenario drive cc-index directly; cc-db opens the handle for it.
cc-index = { path = "../cc-index" }
cc-db = { path = "../cc-db" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
regex = { workspace = true }
# The eval backend drives the REAL MCP dispatch path in-process:
# cc-server's `mcp` module is re-exported as `mcp_wire` (see src/lib.rs)
# and exercised over an rmcp duplex client↔server JSON-RPC connection.
tokio = { workspace = true }
tracing = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
blake3 = { workspace = true }
clap = { workspace = true }
schemars = "1.2"
rusqlite = { workspace = true }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# Local build/source receipts for controlled ablations; no HTTP requirement.
sha2 = "0.10"
libc = { workspace = true }

[features]
default = []
eval-http = ["dep:reqwest"]

[dev-dependencies]
cc-parsers = { path = "../cc-parsers" }
cc-search = { path = "../cc-search" }
tempfile = "3"
# Scale-bench sub-phase attribution: RUST_LOG-gated subscriber so the
# `time_step` debug events from cc-index / cc-db reach stderr.
tracing-subscriber = { workspace = true }
