[package]
name = "cc-eval"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cc-server = { path = "../cc-server" }
cc-model = { path = "../cc-model" }
# RSS sampling (bench/soak) + the watcher-parity Targeted incremental
# scenario drive cc-index directly; cc-db opens the handle for it.
cc-index = { path = "../cc-index" }
cc-db = { path = "../cc-db" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
regex = { workspace = true }
# The eval backend drives the REAL MCP dispatch path in-process:
# cc-server's `mcp` module is re-exported as `mcp_wire` (see src/lib.rs)
# and exercised over an rmcp duplex client↔server JSON-RPC connection.
tokio = { workspace = true }
tracing = { workspace = true }
rmcp = { workspace = true, features = ["client"] }

[dev-dependencies]
tempfile = "3"
# Scale-bench sub-phase attribution: RUST_LOG-gated subscriber so the
# `time_step` debug events from cc-index / cc-db reach stderr.
tracing-subscriber = { workspace = true }
