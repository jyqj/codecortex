        name: p8-task-progress-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}-19
        path: ${{ steps.freeze_19.outputs.bundle }}
        if-no-files-found: error
      id: upload_19
    - name: Preserve final or interrupted task diagnostic boundary
      id: finish
      if: always() && steps.launch.outcome == 'success'
      env:
        PREVIOUS_ARTIFACT_ID: ${{ steps.upload_19.outputs.artifact-id }}
        PREVIOUS_ARTIFACT_DIGEST: ${{ steps.upload_19.outputs.artifact-digest }}
      run: |
        python3 scripts/p8_task_profile_capture.py finish \
          --directory "$RUNNER_TEMP/p8-task-cell-$P8_TASK_CELL" --index 20
    - uses: actions/upload-artifact@v4
      if: always() && steps.finish.outputs.ready == 'true'
      with:
        name: p8-task-progress-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}-final
        path: ${{ steps.finish.outputs.bundle }}
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: p8-task-shard-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/p8-task-cell-${{ matrix.cell }}/shard
        if-no-files-found: error
      name: Preserve the complete task shard separately from diagnostic prefixes
    - name: Return actual task driver and native outcome
      if: always() && steps.launch.outcome == 'success'
      run: |
        python3 scripts/p8_task_profile_capture.py verdict \
          --directory "$RUNNER_TEMP/p8-task-cell-$P8_TASK_CELL"
  aggregate:
    if: always() && needs.build.result == 'success'
    needs:
    - build
    - measure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/artifacts/
    - uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/p8-task-build
        name: p8-task-build-${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/p8-task-shards
        pattern: p8-task-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Validate all 45 cells and retain every failed or missing result
      if: always()
      run: |
        python3 - <<'PY'
        import os, pathlib, sys
        sys.path.insert(0, 'scripts')
        import p8_task_profile_matrix as matrix
        root = pathlib.Path(os.environ['RUNNER_TEMP'])
        binary = root / 'p8-task-build/native-build/p8-scale'
        if binary.exists():
            binary.chmod(0o755)
        inputs = sorted((root / 'p8-task-shards').glob('p8-task-shard-*'))
        result = matrix.aggregate(root / 'p8-task-build', inputs, root / 'p8-task-matrix')
        print({key: result.get(key) for key in ('status', 'error', 'sample_count', 'cell_count')})
        sys.exit(0 if result.get('passed') is True else 1)
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: p8-task-matrix-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/p8-task-matrix
        if-no-files-found: error
      name: Preserve task review including failure
