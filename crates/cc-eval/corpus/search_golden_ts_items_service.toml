name = "search_golden_ts_items_service"
tool = "search"
description = "Golden: exact symbol lookup for NestJS service class ItemsService"

[params]
query = "ItemsService"
mode = "symbol"
exact = true
top_k = 5

[[assertions]]
kind = "is_success"

[[assertions]]
kind = "expected_symbols"
value = "ItemsService"
min_recall = 1.0

[[assertions]]
kind = "output_contains"
value = "app_controller.ts"
