name: Original G4 runtime offline reception

on:
  push:
    branches: [task/p8-g4-runtime-reception-20261009]

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  offline_replay:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require the independently reviewed first receiver attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Check out only the external receiver controller at its actual event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: receiver
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /artifacts/checkpoints/p8-G4-offline-runtime-reception-20261009/
      - name: Check out immutable original G4 product and observers separately
        uses: actions/checkout@v4
        with:
          ref: 260f596582f2d82b8d7c707b61a6b8b6a43b069f
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /crates/
            /scripts/
      - name: Verify original ZIPs, seals, source, all rows and retained statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -u receiver/artifacts/checkpoints/p8-G4-offline-runtime-reception-20261009/controller.py
      - name: Preserve original archives, expanded evidence, failed checks and replay outputs with documented job-log exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-G4-offline-runtime-reception-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p8-G4-offline-runtime
            !${{ runner.temp }}/p8-G4-offline-runtime/mixed/C1/job-113576447129.log
            !${{ runner.temp }}/p8-G4-offline-runtime/mixed/C4/job-113576447195.log
            !${{ runner.temp }}/p8-G4-offline-runtime/mixed/C8/job-113576447334.log
            !${{ runner.temp }}/p8-G4-offline-runtime/mixed/C16/job-113576446998.log
            !${{ runner.temp }}/p8-G4-offline-runtime/soak/job-113576447137.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
