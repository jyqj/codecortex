name = "node_outline_typescript"
tool = "node"
description = "Get the outline of a TypeScript controller class"

[params]
symbol = "ItemsController"
include = "outline"

[[assertions]]
kind = "is_success"

[[assertions]]
kind = "output_contains"
value = "ItemsController"

[[assertions]]
kind = "output_contains"
value = "app_controller.ts"
