name: P8 final preseal evidence readback
on:
  push:
    branches: [work/p8-final-preseal-readback-996727-20261008]
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: synthetic
            artifact: '11540145699'
          - key: prepare
            artifact: '11539832276'
          - key: rust-prepare
            artifact: '11539228641'
          - key: rust-synthetic
            artifact: '11539044028'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve fixed completed original evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
        run: |
          mkdir "$RUNNER_TEMP/ptv2-readback"
          gh api "repos/jyqj/codecortex/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/ptv2-readback/artifact.json"
          gh api repos/jyqj/codecortex/actions/runs/37754844471 > "$RUNNER_TEMP/ptv2-readback/run.json"
          gh api "repos/jyqj/codecortex/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/ptv2-readback/original.zip"
      - name: Inventory all original bytes without executing product or scorer
        env:
          READBACK_ROOT: ${{ runner.temp }}/ptv2-readback
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -S artifacts/checkpoints/p8-final-preseal-readback-20261008/inventory.py --key ${{ matrix.key }}
