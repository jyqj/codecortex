name = "search_golden_go_handler"
tool = "search"
description = "Golden: exact symbol lookup for Go gin handler handleGetUser"

[params]
query = "handleGetUser"
mode = "symbol"
exact = true
top_k = 5

[[assertions]]
kind = "is_success"

[[assertions]]
kind = "expected_symbols"
value = "handleGetUser"
min_recall = 1.0

[[assertions]]
kind = "output_contains"
value = "main.go"
