name: Code index quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-index-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: -D warnings
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  quality-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - name: Prepare isolated output and pinned tokenizer (outside measurements)
        run: |
          out="$RUNNER_TEMP/quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$out"
          echo "QUALITY_OUTPUT=$out" >> "$GITHUB_ENV"
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/tokenizer-cache" >> "$GITHUB_ENV"
          python3 -m pip install -r scripts/requirements-eval.txt
          TIKTOKEN_CACHE_DIR="$RUNNER_TEMP/tokenizer-cache" python3 -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
      - name: Identity-aware metrics, independent facts and incremental/full oracle
        run: |
          cargo test -p cc-eval --locked --lib quality::
          CODECORTEX_FACT_OUTPUT="$QUALITY_OUTPUT/facts.raw.jsonl" cargo test -p cc-eval --locked --test fact_oracle
          cargo test -p cc-eval --locked --test incremental_oracle
          python3 -m unittest discover -s scripts/tests -v
      - name: Real MCP retrieval observations and exact replay
        run: |
          out="$QUALITY_OUTPUT/default"
          cargo run -p cc-eval --locked --example quality_run -- crates/cc-eval/benchmarks/quality_adversarial.json "$out" 3
          cargo run -p cc-eval --locked --example quality_replay -- "$out/raw.jsonl" "$out/replayed.json"
          cmp "$out/report.json" "$out/replayed.json"
          python3 scripts/evidence_budget.py "$out/raw.jsonl" "$out/budget.json" --tokenizer-cache "$TIKTOKEN_CACHE_DIR"
          python3 scripts/evidence_budget.py "$out/raw.jsonl" "$out/budget-replayed.json" --tokenizer-cache "$TIKTOKEN_CACHE_DIR"
          cmp "$out/budget.json" "$out/budget-replayed.json"
      - name: Candidate-stage diagnostics (separate instrumented measurement)
        run: |
          out="$QUALITY_OUTPUT/trace"
          cargo run -p cc-eval --locked --example quality_run -- crates/cc-eval/benchmarks/quality_adversarial.json "$out" 1 crates/cc-eval/benchmarks/trace_candidates.json
          python3 scripts/evidence_budget.py "$out/raw.jsonl" "$out/budget.json" --tokenizer-cache "$TIKTOKEN_CACHE_DIR"
      - name: Test/documentation baselines
        run: bash scripts/update-doc-baselines.sh
      - name: Retain raw evidence even when gates fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 90
          if-no-files-found: warn

  scale-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: scale-release
      - name: Release 1k scale and ground-truth smoke
        env:
          CODECORTEX_WRITE_BENCHMARK: '1'
        run: cargo test -p cc-eval --locked --release --test scale_bench bench_synthetic_1k -- --ignored --nocapture
      - name: Retain scale observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-1k-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/benchmarks/synthetic_1k_latest.md
          retention-days: 90
          if-no-files-found: warn
