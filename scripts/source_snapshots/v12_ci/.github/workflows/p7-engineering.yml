name: P7 engineering regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: -D warnings

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # Keep this job's Cargo target private to its fresh checkout. The existing
      # CI and immutable historical process-fault/GC-WAL gates remain separate.
      - name: Record exact input source
        id: source
        run: |
          mkdir -p "$RUNNER_TEMP/p7-engineering"
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from p7_build_identity import json_bytes, source_snapshot
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-engineering'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-engineering-cargo'
          assert not target.exists()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CARGO_TARGET_DIR={target}\nCARGO_BUILD_BUILD_DIR={target}\n')
          (out / 'source-before.json').write_bytes(json_bytes(source_snapshot(pathlib.Path.cwd())))
          PY

      - name: Dense coverage and GC configuration regression
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test -p cc-server --features semantic-http --locked \
            --test p7_dense_artifact_coverage --test p7_gc_retention_config \
            --test p7_v05_all_lane_scope --test p7_v05_scope_public \
            --test p7_v16_exact_oracle --test p7_v16_oracle_independent_review \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p7-engineering/coverage-config.log"

      - name: Original deadline, cache and public retrieval matrix
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test -p cc-server --features semantic-http --locked --no-fail-fast \
            --test cache_key_review_behavior --test p7_acceptance_matrix \
            --test p7_production_fairness_model_review --test p7_query_deadline_public \
            --test p7_status_snapshot_independent_review --test p7_v05_v11_independent_review \
            --test p7_v11_cache_consumption --test p7_v11_cache_key_matrix \
            --test p7_v11_generation_public --test p7_v11_ready_epoch_independent_review \
            --test v11_consumption_independent_review \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p7-engineering/deadline-cache.log"

      - name: Original query encoding and absolute deadline controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test -p cc-server --features semantic-http --locked --lib \
            semantic_query_encoding::tests:: -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-engineering/query-encoding.log"
          cargo test -p cc-search --locked --lib execution::tests:: -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/p7-engineering/execution-deadline.log"

      - name: Benchmark input lock controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s tests/evidence_lock -v \
            2>&1 | tee "$RUNNER_TEMP/p7-engineering/input-lock.log"

      - name: GC unlink and existing GC controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test -p cc-semantic --locked \
            --test gc_unlink_accounting --test semantic_gc \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p7-engineering/gc-unlink.log"

      - name: Worker contention and strategy protocol controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        env:
          CODECORTEX_WORKER_CONTENTION_EVIDENCE_DIR: ${{ runner.temp }}/p7-engineering/worker-contention
          CODECORTEX_LIFECYCLE_RECEIPT_DIR: ${{ runner.temp }}/p7-engineering/lifecycle
        run: |
          set -o pipefail
          cargo test -p cc-eval --features semantic --locked \
            --test p7_worker_contention --test semantic_lifecycle --test p7_strategy_ablation \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p7-engineering/worker-strategy.log"

      - name: Verify final input identity
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from p7_build_identity import json_bytes, source_snapshot
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p7-engineering'
          current = source_snapshot(pathlib.Path.cwd())
          (out / 'source-after.json').write_bytes(json_bytes(current))
          assert json.loads((out / 'source-before.json').read_text()) == current
          PY

      - name: Preserve executed commands and raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-engineering-${{ github.sha }}
          path: ${{ runner.temp }}/p7-engineering
          if-no-files-found: error
