name: P8 exact original synthetic evidence readback
on:
  push:
    branches: [work/p8-temporal-readback-996727-20261008]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact completed original synthetic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/ptv2-readback"
          gh api repos/jyqj/codecortex/actions/artifacts/11538793031 > "$RUNNER_TEMP/ptv2-readback/artifact.json"
          gh api repos/jyqj/codecortex/actions/runs/37752995462 > "$RUNNER_TEMP/ptv2-readback/run.json"
          gh api repos/jyqj/codecortex/actions/artifacts/11538793031/zip > "$RUNNER_TEMP/ptv2-readback/original.zip"
      - name: Export retained original measurement and control evidence without execution
        env:
          READBACK_ROOT: ${{ runner.temp }}/ptv2-readback
          READBACK_MODE: synthetic-control
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -S artifacts/checkpoints/p8-temporal-readback-20261008/export_original.py --part ${{ matrix.part }}
