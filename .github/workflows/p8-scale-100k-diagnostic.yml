name: P8 independent 100k diagnostic with retained progress

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: ""

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'p8-scale-100k-diagnostic-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/artifacts/
            /artifacts/checkpoints/capability-snapshot-optimization-20261003/current-status-under-test.rs
            /artifacts/checkpoints/capability-snapshot-optimization-20261003/v2-status-checks.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Original formatting and scale protocol controls
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/p8-diagnostic-protocol-cargo
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p cc-eval --test p8_scale
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_p8_scale_diagnostic_capture.py -v
      - name: Compile one immutable executable with the original driver
        run: |
          python3 scripts/p8_scale_matrix.py build --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/p8-diagnostic-build" --target-directory "$RUNNER_TEMP/p8-diagnostic-cargo"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-100k-diagnostic-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p8-diagnostic-build
          if-no-files-found: error

  diagnose:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Set diagnostic directory after runner allocation
        run: echo "DIAGNOSTIC_DIR=$RUNNER_TEMP/p8-100k-diagnostic" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/artifacts/
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: actions/download-artifact@v4
        with:
          name: p8-100k-diagnostic-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p8-diagnostic-build
      - name: Original capacity preparation
        env:
          P8_EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          P8_CAPACITY_PREPARE_ALLOWED: ${{ github.repository == 'jyqj/codecortex' && runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          python3 scripts/p8_runner_capacity.py --scale 100000 \
            --output "$RUNNER_TEMP/p8-diagnostic-capacity" --prepare-ephemeral
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p8-100k-diagnostic-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p8-diagnostic-capacity
          if-no-files-found: error
      - name: Launch the original full-stage 100k rep0 command
        id: launch
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          chmod +x "$RUNNER_TEMP/p8-diagnostic-build/p8-scale"
          python3 scripts/p8_scale_diagnostic_capture.py launch --directory "$DIAGNOSTIC_DIR" \
            --root "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/p8-diagnostic-build" --expected-source "$EXPECTED_SOURCE"
      - name: Freeze original byte prefix at interval 1 of 20
        id: checkpoint_00
        if: always() && steps.launch.outcome == 'success'
        run: python3 scripts/p8_scale_diagnostic_capture.py checkpoint --directory "$DIAGNOSTIC_DIR" --index 0
      - uses: actions/upload-artifact@v4
        id: upload_00
        if: always() && steps.checkpoint_00.outputs.ready == 'true'
        continue-on-error: true
        with:
          name: p8-100k-diagnostic-progress-${{ github.run_id }}-${{ github.run_attempt }}-00
          path: ${{ steps.checkpoint_00.outputs.bundle }}
          if-no-files-found: error
      - name: Freeze original byte prefix at interval 2 of 20
        id: checkpoint_01
        if: always() && steps.launch.outcome == 'success' && (steps.checkpoint_00.outputs.running == 'true' || steps.checkpoint_00.outcome == 'failure')
        env:
          PREVIOUS_ARTIFACT_ID: ${{ steps.upload_00.outcome == 'success' && steps.upload_00.outputs.artifact-id || '' }}
